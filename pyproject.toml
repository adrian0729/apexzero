[project]
name = "apexzero"
version = "0.1.0"
description = "A generalist RL racing agent trained on procedural tracks, measured against minimum-lap-time optimal control, and used to study where F1 drivers lose time."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = { text = "Apache-2.0" }
dependencies = [
    "numpy>=2.0",
    "scipy>=1.13",
    "jax>=0.7",
    "flax>=0.10",
    "optax>=0.2.4",
]

[dependency-groups]
data = ["httpx>=0.27", "polars>=1.10", "pyarrow>=17"]
ocp = ["casadi>=3.6.7"]
bayes = ["numpyro>=0.16", "arviz>=0.20"]
viz = ["matplotlib>=3.9"]
rlref = ["gymnax>=0.0.8"]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.uv]
default-groups = ["data", "ocp", "viz", "dev"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apexzero"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint.flake8-bugbear]
# Immutable NamedTuple configs are safe as default arguments.
extend-immutable-calls = ["EnvParams", "apexzero.env.racing.EnvParams"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["RUF059"]
